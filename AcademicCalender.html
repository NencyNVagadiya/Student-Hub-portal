<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudentHub Dashboard</title>
<link rel="stylesheet" href="academiccalander.css">
</head>
<body>
    
     <header>
    <nav>
      <div class="left" onclick="toggleMenu()">☰</div>
      <div id="sidebar" class="sidebar">
         <div class="close-btn" onclick="toggleMenu()"> ← </div>
            <a href="AcademicCalender.html">📅ACADEMIC CALENDAR </a>
            <a href="faculty.html">👩🏼‍🏫🧑🏻‍🏫FACULTYS(DEPSTAR)</a>

            <a href="certificate.html">📜 Certificates</a></div>
    
      <div class="right" id="theme-toggle">🌙</div>
      </nav>
 </header>

 <img src="image/academic-calender.png" alt="Academic Calendar" class="calendar">

 <script>
    const toggle = document.getElementById("theme-toggle");

    toggle.addEventListener("click", function () {
        document.body.classList.toggle("dark-mode");

        if (document.body.classList.contains("dark-mode")) {
            toggle.textContent = "☀️";
        } else {
            toggle.textContent = "🌙";
        }
    });
    </script>
    
    <script>

function toggleMenu(){

    const sidebar = document.getElementById("sidebar");

    if(sidebar.style.left=="0px"){
        sidebar.style.left="-300px";
    }
    else{
        sidebar.style.left="0px";
    }

}

</script>
</body>
</html>
