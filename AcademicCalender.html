 <script>
const toggle = document.getElementById("theme-toggle");

/* Apply saved theme when page opens */
if (localStorage.getItem("darkMode") === "enabled") {
    document.body.classList.add("dark-mode");

    if (toggle) {
        toggle.textContent = "☀️";
    }
}

/* Change theme */
if (toggle) {
    toggle.addEventListener("click", function () {

        document.body.classList.toggle("dark-mode");

        if (document.body.classList.contains("dark-mode")) {

            localStorage.setItem("darkMode", "enabled");
            toggle.textContent = "☀️";
            calendarImage.src = "image/academic-calender-dark.png";

        } else {

            localStorage.setItem("darkMode", "disabled");
            toggle.textContent = "🌙";
            calendarImage.src = "image/academic-calender.png";
        }

    });
}
</script>
    
    <script>

function toggleMenu(){

    const sidebar = document.getElementById("sidebar");/* It selects an HTML element by its ID.*/

    if(sidebar.style.left=="0px"){
        sidebar.style.left="-300px";
    }
    else{
        sidebar.style.left="0px";
    }

}

</script>
