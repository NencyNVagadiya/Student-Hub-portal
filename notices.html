    <h1>📢 StudentHub Notices</h1>

    <!-- Search -->
    <input
        type="text"
        id="search"
        placeholder="Search notices..."
        oninput="displayNotices()"
    >

    <!-- Filter -->
    <select id="filter" onchange="displayNotices()">

        <option value="All">All Categories</option>
        <option value="Exam">Exam</option>
        <option value="Holiday">Holiday</option>
        <option value="Workshop">Workshop</option>
        <option value="Academic">Academic</option>
        <option value="Event">Event</option>
        <option value="Notice">Notice</option>

    </select>

    <!-- Sorting -->
    <select id="sort" onchange="displayNotices()">

        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
        <option value="az">Title A-Z</option>
        <option value="za">Title Z-A</option>

    </select>

    <!-- Notices will appear here -->
    <div id="noticeContainer"></div>

    <!-- Pagination -->
    <div id="pagination"></div>

    <script src="notices.js"></script>

</body>
