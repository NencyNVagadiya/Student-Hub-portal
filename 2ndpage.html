<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudentHub Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
}

/* Navigation */

header{
    padding:20px;
}

nav{
    width:95%;
    height:35px;
    background:#ece8f6;
    margin:auto;
    border-radius:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 15px;
}

.menu{
    font-size:18px;
    cursor:pointer;
}

.mode{
    font-size:18px;
    cursor:pointer;
}

/* Dashboard */

main{
    width:90%;
    margin:60px auto;
}

.container{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
}

.column{
    min-height:420px;
    border-right:2px solid #d9d9d9;
    padding:20px;
}

.column:last-child{
    border-right:none;
}

.card{
    margin-bottom:120px;
}

.card h2{
    font-size:32px;
    font-weight:bold;
    color:#222;
}

</style>

</head>

<body>

<header>

<nav>

<div class="menu">
☰
</div>

<div class="mode">
🌙
</div>

</nav>

</header>

<main>

<div class="container">

<div class="column">

<div class="card">
<h2>Time Table</h2>
</div>

<div class="card">
<h2>Result</h2>
</div>

</div>

<div class="column">

<div class="card">
<h2>Fees</h2>
</div>

<div class="card">
<h2>Coursera Certificates</h2>
</div>

</div>

<div class="column">

<div class="card">
<h2>Attendance</h2>
</div>

<div class="card">
<h2>Another Certificate</h2>
</div>

</div>

</div>

</main>

</body>
</html>
