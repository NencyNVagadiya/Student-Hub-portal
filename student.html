<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Login</title>
   <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<header>

<nav>
<div class="left"></div>

<div class="right">
<div id="theme-toggle" style="cursor:pointer;">🌙</div>
</div>

</nav>

</header>

<main>

<section>

<h1 class="login">LOGIN</h1>

<div class="line"></div>
<form class="box" action="login.php" method="POST">

    <div class="user">
        <label for="user">Username</label><br>
        <input type="text" id="user" name="username" placeholder="Enter Username" required >
    </div>

    <div class="pass">
        <label for="pass">Password</label><br>
        <input type="password" id="pass" name="password" placeholder="Enter Password" required >
    </div>

    <div class="btn">
        <button type="submit">
            Login
        </button>
    </div>

</form>
<p class="register-link">
    Don't have an account?
    <a href="register.html">Register</a>
</p>
</section>
</main>
<script>
const toggle = document.getElementById("theme-toggle");

/* Apply saved theme when page opens */
if (localStorage.getItem("darkMode") === "enabled") {
    document.body.classList.add("dark-mode");

    if (toggle) {
        toggle.textContent = "☀️";
    }
}

/* Change theme */
if (toggle) {
    toggle.addEventListener("click", function () {

        document.body.classList.toggle("dark-mode");

        if (document.body.classList.contains("dark-mode")) {

            localStorage.setItem("darkMode", "enabled");
            toggle.textContent = "☀️";

        } else {

            localStorage.setItem("darkMode", "disabled");
            toggle.textContent = "🌙";

        }

    });
}
</script>

</body>
</html>
